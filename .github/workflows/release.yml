name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be vMAJOR.MINOR.PATCH with MINOR and PATCH below 100"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "build=$((BASH_REMATCH[1] * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    env:
      CRUMBLE_VERSION: ${{ needs.version.outputs.name }}
      CRUMBLE_BUILD_NUMBER: ${{ needs.version.outputs.build }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Restore the API key and the Developer ID certificate
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          echo "APP_STORE_CONNECT_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build, notarize, and staple Crumble.app
        id: build
        run: echo "zip=macos/$(./scripts/release.sh)" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Crumble $CRUMBLE_VERSION" --generate-notes

  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      CRUMBLE_VERSION: ${{ needs.version.outputs.name }}
      CRUMBLE_BUILD_NUMBER: ${{ needs.version.outputs.build }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Restore the API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          echo "APP_STORE_CONNECT_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and upload to TestFlight
        run: ./scripts/release.sh
