name: macOS
on:
  pull_request:
    paths:
      - macos/**
      - apfelkern/**
      - .github/workflows/macos.yml
  push:
    branches: [main]
    paths:
      - macos/**
      - apfelkern/**
      - .github/workflows/macos.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: macos
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: swift test
