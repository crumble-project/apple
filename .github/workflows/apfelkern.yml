name: apfelkern
on:
  push:
    paths:
      - apfelkern/**
      - .github/workflows/apfelkern.yml
  pull_request:
    paths:
      - apfelkern/**
      - .github/workflows/apfelkern.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: apfelkern
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: apfelkern/.build/openapi-generator-1.14.2
          key: generator-${{ runner.os }}-${{ hashFiles('apfelkern/Generation/tools.json', 'apfelkern/Generation/generator-Package.resolved') }}
      - run: python3 scripts/contract.py --check
      - run: swift build
      - run: swift test
      - run: brew install swiftlint
      - run: swiftlint lint
      - run: xcodebuild -scheme BotAvatar -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
