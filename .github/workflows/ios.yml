name: iOS
on:
  pull_request:
    paths:
      - ios/**
      - apfelkern/**
      - .github/workflows/ios.yml
  push:
    branches: [main]
    paths:
      - ios/**
      - apfelkern/**
      - .github/workflows/ios.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: ios
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/.packages
            ios/build
            !ios/build/Index.noindex
          key: build-${{ runner.os }}-${{ hashFiles('ios/Crumble.xcodeproj/project.pbxproj', 'ios/Crumble.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: ./scripts/build.sh
  lint:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: brew install swiftlint
      - run: swiftlint lint
