name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      CRUMBLE_PACKAGES_DIR: ${{ github.workspace }}/.packages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .packages
          key: spm-${{ runner.os }}-${{ hashFiles('Crumble.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: ./scripts/test.sh unit
